services:
  # ── Web Service ─────────────────────────────────────────────────────────────
  - type: web
    name: inventory-management
    env: python
    region: singapore          # change to your preferred region
    plan: free                 # upgrade to 'starter' for always-on
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true    # Render auto-generates a secure random value
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
databases:
  - name: inventory-db
    databaseName: inventory
    user: inventory_user
    plan: free
    region: singapore          # must match web service region
