{% extends "base.html" %}

{% block title %}403 Access Forbidden - Inventory Management System{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-danger mb-2">403</div>
        <h2 class="fw-bold mb-3">Access Denied / Forbidden</h2>
        <p class="text-muted lead mb-4">You do not have permission to view or modify this inventory item.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary btn-lg fw-bold px-4">
            <i class="bi bi-speedometer2 me-2"></i> Go to My Dashboard
        </a>
    </div>
</div>
{% endblock %}
