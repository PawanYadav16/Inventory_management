{% extends "base.html" %}

{% block title %}500 Internal Error - Inventory Management System{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-warning mb-2">500</div>
        <h2 class="fw-bold mb-3">Internal Server Error</h2>
        <p class="text-muted lead mb-4">An unexpected error occurred on the server. The database transaction has been safely rolled back.</p>
        <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('dashboard.home') }}" class="btn btn-primary btn-lg fw-bold px-4">
            <i class="bi bi-arrow-clockwise me-2"></i> Return to Main Page
        </a>
    </div>
</div>
{% endblock %}
