{% extends "base.html" %}

{% block title %}404 Not Found - Inventory Management System{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-primary mb-2">404</div>
        <h2 class="fw-bold mb-3">Page Not Found</h2>
        <p class="text-muted lead mb-4">The page or inventory resource you requested does not exist or has been moved.</p>
        <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('dashboard.home') }}" class="btn btn-primary btn-lg fw-bold px-4">
            <i class="bi bi-house me-2"></i> Return to Safety
        </a>
    </div>
</div>
{% endblock %}
